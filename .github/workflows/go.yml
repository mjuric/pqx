name: Go

on:
  push:
    branches: [master, native-port]
    paths: ["go/**", "tools/**", "ruff.toml", ".github/workflows/**"]
  pull_request:
    paths: ["go/**", "tools/**", "ruff.toml", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: make vet
      - name: staticcheck
        # pinned; its settings are in go/staticcheck.conf
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 -tags duckdb_arrow ./...
      - run: make test
      - name: Build (time and size)
        if: runner.os == 'Linux'
        run: |
          go clean -cache
          time make build
          ls -l bin/pqx
          bin/pqx --version

  scripts:
    # the repository's Python (tools/, the test-data generators, the pty harness,
    # packaging) and the workflows; none of it needs Python pqx
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - name: ruff
        run: uvx ruff@0.16.9 check .
      - name: actionlint
        # pinned; uses the runner's shellcheck for the run: scripts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Parity harness selftests
        run: |
          w=(--no-project --with pyte==0.8.2 --with pyyaml --with pyarrow --with numpy)
          uv run "${w[@]}" python go/bench/parity/run.py --selftest
          uv run "${w[@]}" python go/bench/parity/security.py --selftest
      - name: The fixtures come out the same without Python pqx
        # byte for byte, except where NumPy's float functions differ in the last bit
        # between CPUs (demo.parquet's coordinates): then the same schema, metadata
        # and values, floats to 1e-12
        run: |
          w=(--no-project --with pyarrow==25.0.1 --with numpy==2.5.3)
          uv run "${w[@]}" python go/testdata/make_fixtures.py "$RUNNER_TEMP/fixtures"
          uv run "${w[@]}" python - go/testdata/fixtures "$RUNNER_TEMP/fixtures" <<'PY'
          import filecmp, glob, os, sys
          import numpy as np, pyarrow as pa, pyarrow.parquet as pq
          ref, new = sys.argv[1:]
          for f in sorted(glob.glob(os.path.join(ref, "*.parquet"))):
              g = os.path.join(new, os.path.basename(f))
              if filecmp.cmp(f, g, shallow=False):
                  print("identical", os.path.basename(f))
                  continue
              a, b = pq.read_table(f), pq.read_table(g)
              assert a.schema.equals(b.schema, check_metadata=True), f
              for name, x, y in zip(a.column_names, a.columns, b.columns):
                  if pa.types.is_floating(x.type):
                      ok = np.allclose(x.to_numpy(), y.to_numpy(), rtol=1e-12, atol=0, equal_nan=True)
                  else:
                      ok = x.equals(y)
                  assert ok, f"{f}: column {name} differs"
              print("same values", os.path.basename(f))
          PY
      - name: tools/ scripts run with uv
        run: |
          uv run tools/make_demo.py "$RUNNER_TEMP/demo.parquet" --rows 10000
          uv run tools/make_trips.py "$RUNNER_TEMP/trips.parquet" 10000
