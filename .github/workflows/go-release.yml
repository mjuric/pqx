name: Go release

# Builds the Go pqx for every release platform (D6), smoke-tests each binary and
# wheel, and keeps the wheels and the GitHub Release archives as artifacts.
# - pull request (packaging changes): builds 0.3.0.dev<run>, uploads nothing.
# - dispatch: builds the version given; uploads to TestPyPI only with publish: testpypi.
# - a v0.3.* tag: builds the tag's version, uploads the wheels to PyPI (job `pypi`,
#   environment `pypi`) and creates a *draft* GitHub Release with the archives (job
#   `github-release`), which the owner publishes by hand. See docs/runbooks/release.md.
# Nothing here runs on v0.2.* tags or on published Releases (Python pqx 0.2.x is
# released from the python-0.2 branch, with its own workflow).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 version to build, e.g. 0.3.0rc1"
        required: true
      publish:
        description: "Upload the wheels to TestPyPI"
        type: choice
        options: [none, testpypi]
        default: none
  push:
    tags: ["v0.3.*"]
  pull_request:
    paths: ["go/packaging/**", ".github/workflows/go-release.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a newer push cancels a pull request's run; a release run is never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) v="$INPUT" ;;
            push)                                           # tag v0.3.0rc1 -> 0.3.0rc1
              [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::push of $GITHUB_REF is not a tag"; exit 1; }
              v="${GITHUB_REF_NAME#v}" ;;
            *) v="0.3.0.dev${GITHUB_RUN_NUMBER}" ;;         # pull requests: a dev version
          esac
          # normalized PEP 440: N.N.N[{a|b|rc}N][.postN][.devN]; the build job checks
          # that every binary's --version prints exactly this
          echo "$v" | grep -Eq '^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$' \
            || { echo "::error::'$v' is not a normalized PEP 440 version"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$v"; exit 1; }
            case "$v" in 0.3.*) ;; *) echo "::error::$v is not a 0.3.x version"; exit 1 ;; esac
          fi
          # a, b, rc and dev versions are pre-releases (PEP 440)
          if echo "$v" | grep -Eq '(a|b|rc)[0-9]+|\.dev[0-9]+'; then pre=true; else pre=false; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "version $v, prerelease $pre"

  build:
    needs: version
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            plat: manylinux_2_28_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            plat: manylinux_2_28_aarch64
          - target: darwin-arm64
            runner: macos-14
            plat: macosx_13_0_arm64
          - target: darwin-amd64
            runner: macos-15-intel   # macos-13, the last other Intel image, is retired
            plat: macosx_13_0_x86_64
          - target: windows-amd64
            runner: windows-2022
            plat: win_amd64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EXE: ${{ startsWith(matrix.target, 'windows') && 'pqx.exe' || 'pqx' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Container setup
        if: matrix.container
        run: |
          git config --global --add safe.directory '*'
          # the manylinux images keep each CPython under /opt/python
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: ${{ !matrix.container }}
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: MinGW-w64 gcc 14.2 UCRT (the toolchain DuckDB's Windows libraries are built with)
        # DuckDB's prebuilt libraries come from MinGW-Builds 14.2.0 (posix, seh, UCRT); a
        # newer gcc (MSYS2's 16.x) fails to link them (undefined __emutls_v symbols)
        if: runner.os == 'Windows'
        env:
          URL: https://github.com/niXman/mingw-builds-binaries/releases/download/14.2.0-rt_v12-rev0/x86_64-14.2.0-release-posix-seh-ucrt-rt_v12-rev0.7z
          SHA256: 0f1afc3b48f66dda68fbfb7b8b0f1d22b831396fbe1e3dea776745f32d930b24
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mingw.7z" "$URL"
          echo "$SHA256  $RUNNER_TEMP/mingw.7z" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/mingw.7z" > /dev/null
          cygpath -w "$RUNNER_TEMP/mingw64/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: |
          go version
          ${CC:-gcc} --version | head -1
          python --version

      - name: Build
        run: |
          mkdir -p out
          time go/packaging/build.sh "$VERSION" "out/$EXE"

      - name: Inspect the binary
        run: |
          ls -l "out/$EXE"
          case "$RUNNER_OS" in
            Linux)
              objdump -p out/pqx | grep NEEDED
              newest=$(objdump -T out/pqx | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
              echo "newest glibc symbol version: $newest"
              allowed='^(libc|libm|libresolv|libpthread|libdl|librt)\.so\.[0-9]+$|^ld-linux'
              if objdump -p out/pqx | awk '/NEEDED/ {print $2}' | grep -Ev "$allowed"; then
                echo "::error::the binary needs libraries beyond glibc's"; exit 1
              fi
              # a sort -V comparison: the newest version must not be above 2.28
              [ "$(printf '%s\n' "$newest" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ] \
                || { echo "::error::needs $newest, newer than manylinux_2_28 allows"; exit 1; }
              ;;
            macOS)
              otool -L out/pqx
              otool -l out/pqx | grep -A4 LC_BUILD_VERSION
              minos=$(otool -l out/pqx | awk '/LC_BUILD_VERSION/ {f=1} f && $1=="minos" {print $2; exit}')
              [ "$minos" = 13.0 ] || { echo "::error::minos is $minos, not 13.0"; exit 1; }
              ;;
            Windows)
              objdump -p out/pqx.exe | grep 'DLL Name' || true
              ;;
          esac

      - name: Smoke test the binary
        run: |
          "out/$EXE" --version
          "out/$EXE" --version | head -1 | grep -qx "pqx $VERSION"
          "out/$EXE" --help > /dev/null
          if [ "$RUNNER_OS" = Windows ]; then python -m pip install -q pywinpty; fi
          python go/packaging/smoke.py "out/$EXE" go/testdata/fixtures/demo.parquet \
            --expect "20,000 rows" --expect diaSourceId

      - name: Wheel and archive
        run: |
          python go/packaging/make_wheel.py --binary "out/$EXE" --version "$VERSION" --plat "${{ matrix.plat }}" --out-dir dist
          python go/packaging/make_archive.py --binary "out/$EXE" --version "$VERSION" --target "${{ matrix.target }}" --out-dir dist
          python -m zipfile -l dist/*.whl
          ls -l dist

      - name: Install the wheel (pip and uvx)
        run: |
          python go/packaging/check_install.py dist/*.whl "$VERSION"
          python -m pip install -q uv
          python -m uv tool run --from "$(ls dist/*.whl)" pqx --version | head -1 | grep -qx "pqx $VERSION"
          echo "uvx OK"

      - name: auditwheel
        if: matrix.container
        run: |
          auditwheel show dist/*.whl 2>&1 | tee audit.txt
          # auditwheel names the most compatible tag the wheel meets; it must be
          # manylinux_2_28 or older, with no ISA extensions beyond the baseline
          glibc=$(grep -o '"manylinux_2_[0-9]*_' audit.txt | head -1 | tr -dc 0-9 | cut -c2-)
          if [ -z "$glibc" ] || [ "$glibc" -gt 28 ] || grep -qi 'unsupported ISA\|instruction set' audit.txt; then
            echo "::error::the wheel doesn't meet ${{ matrix.plat }}"; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pqx-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  check:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pqx-*
          path: dist
          merge-multiple: true
      - name: Check the wheels
        run: |
          ls -l dist
          python -m pip install -q twine check-wheel-contents
          twine check --strict dist/*.whl
          # W007 ("library is empty") is expected: the wheel holds only the binary
          check-wheel-contents --ignore W007 dist/*.whl
          test "$(find dist -name '*.whl' | wc -l)" = 5
          test "$(find dist -name '*.tar.gz' -o -name '*.zip' | wc -l)" = 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels
          path: dist/*.whl

  testpypi:
    # only on an explicit dispatch with publish: testpypi
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    needs: check
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # OIDC for TestPyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    # only on a v0.3.* tag, after every platform build and the check job passed
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.3.')
    needs: [version, check]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pqx/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write   # OIDC for PyPI trusted publishing: no API token stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: dist
      - name: Check the wheels are this version's five
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          test "$(find dist -name '*.whl' | wc -l)" = 5
          test "$(find dist -name "pqx-$VERSION-py3-none-*.whl" | wc -l)" = 5
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    # only on a v0.3.* tag: a draft Release with the five archives, for the owner
    # to review and publish; this job never publishes it
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.3.')
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft Release and upload its files
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pqx-*
          path: dist
          merge-multiple: true
      - name: Draft the GitHub Release
        run: |
          ls -l dist
          shopt -s nullglob
          files=(dist/pqx-"$VERSION"-*.tar.gz dist/pqx-"$VERSION"-*.zip)
          test "${#files[@]}" = 5
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # a re-run: replace the files of the draft, never touch a published Release
            [ "$state" = true ] || { echo "::error::Release $TAG is already published"; exit 1; }
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            pre=(); [ "$PRERELEASE" = true ] && pre=(--prerelease)
            gh release create "$TAG" "${files[@]}" --draft --verify-tag "${pre[@]}" \
              --title "pqx $VERSION" --generate-notes
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'
