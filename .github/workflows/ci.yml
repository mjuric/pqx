name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]   # a release tag runs the full matrix alongside publish.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs the tags and history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check pqx tests
      - name: Test
        run: pytest -v

  package:
    name: build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs the tags and history
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        env:
          UV_PYTHON: "3.12"
        run: uv build
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv /tmp/pqx-wheel --python 3.12
          uv pip install --python /tmp/pqx-wheel dist/*.whl
          /tmp/pqx-wheel/bin/pqx --version
          /tmp/pqx-wheel/bin/python -c "import pqx, importlib.resources as r; assert pqx.__version__ != '0.0.0.dev0'; assert (r.files('pqx') / 'app.tcss').is_file()"
