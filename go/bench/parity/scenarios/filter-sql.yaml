description: |
  A whole query over the table t (GROUP BY) shown as a table.
covers:
  - "README Filter: or a whole query over the table t"
  - "README tour: pqx trips.parquet -w \"select vendor, count(*) from t group by 1\""
fixture: demo
steps:
  - keys: /
    wait: 'enter apply'
  - text: "select band, count(*) as n, avg(mag) as mean_mag from t group by 1 order by 1"
  - keys: enter
    wait: '✓ 6 rows'
  - check: result
    expect: ['band +n +mean_mag', '^ │ +0 +g +3,?354']
  - keys: down down
  - check: moved
