description: |
  `=` in the detail panel acts on the selected field; the panel keeps focus on the same
  field and record, so `=` on a second field narrows again.
covers:
  - "README All keys: = y i F < > | detail panel: ... after = the panel keeps focus on the same field and record"
fixture: demo
steps:
  - keys: down down down
    wait: 'row 3\b'
  - keys: d
    wait: 'row 3 · file row 3'
  - keys: tab
    wait: '↑↓ column'
  - keys: down down down down down down down
  - keys: "="
    wait: '› band = '
  - check: first-equals
    expect: ['row \d+ · file row 3', '↑↓ column']   # same record, still in the panel
  - keys: up up up up up up up
  - keys: "="
    wait: '› band = \S+ and diaSourceId = 170000000000000003'
  - check: second-equals
