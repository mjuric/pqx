description: |
  `?` opens the help; it scrolls; Esc closes it.
covers:
  - "README Keys: Press ? in pqx for the full list."
fixture: demo
steps:
  - keys: "?"
    wait: 'Parquet explorer'
  - check: help
    expect: ['Written by', 'Filtering and queries']
  - keys: pgdn
  - check: help-pgdn
  # pins the intended differences: the end of the help lists the command palette in
  # Python pqx only (D2) and Ctrl+Z in Go pqx only (D11)
  - keys: end
    wait: '│ (?:[?] +│ this help|Ctrl[+]Z +│ suspend pqx)'
    expect_app@120x40:
      go: 'Ctrl[+]Z +│ suspend pqx; fg in the shell brings it back'
    expect_not_app@120x40:
      python: 'Ctrl[+]Z'
    expect_app@200x50:
      python: 'Ctrl[+]P +│ command palette'
      go: 'Ctrl[+]Z +│ suspend pqx; fg in the shell brings it back'
    expect_not_app@200x50:
      go: 'Ctrl[+]P'
      python: 'Ctrl[+]Z'
  - keys: pgup
    expect_app@120x40:
      python: 'Ctrl[+]P +│ command palette'
    expect_not_app@120x40:
      go: 'Ctrl[+]P'
  - keys: esc
    wait_gone: 'Parquet explorer'
  - check: closed
  - keys: "?"
    wait: 'Parquet explorer'
  - keys: q
    wait_gone: 'Parquet explorer'
  - check: q-closes   # q closes the help, it doesn't quit
  - keys: "?"
    wait: 'Parquet explorer'
  - keys: "?"
    wait_gone: 'Parquet explorer'
