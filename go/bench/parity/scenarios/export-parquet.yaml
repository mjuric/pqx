description: |
  `e` with the default format (Parquet) after hiding a column: the export has the
  visible columns and the filtered rows.
covers:
  - "README Export: write the current view (filter, sort and visible columns) to Parquet"
fixture: demo
steps:
  - keys: "-"
    toast: 'Hid diaSourceId'
  - keys: /
    wait: 'enter apply'
  - text: "mag < 18"
  - keys: enter
    wait: '✓ 11 rows'
  - keys: e
    wait: 'Export current view'
  - check: dialog
    expect: '15 visible'
  - keys: ctrl+u
  - text: "view.parquet"
  - keys: enter
    toast: 'Wrote 11 rows'
    check: done
  - file: "{out}/view.parquet"
