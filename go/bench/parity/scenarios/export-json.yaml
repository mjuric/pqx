description: |
  `e` to newline-delimited JSON, chosen by the file's extension, of a SQL query's result.
covers:
  - "README Export: to Parquet, CSV or JSON"
  - "help: **e** | export the current view (filter + sort) to Parquet / CSV / JSON"
fixture: demo
python_bug:
  - checks: [done]
    region: keybar
    ref_shows: 'enter apply   esc back'   # Python shows the filter box's keys
    correct: '^\s*/ filter   x clear filter'   # what the key bar should show there
    note: "Python pqx's key bar can keep the filter box's keys after a dialog with an input closes (racy)"
steps:
  - keys: /
    wait: 'enter apply'
  - text: "select band, count(*) as n from t group by 1 order by 1"
  - keys: enter
    wait: '✓ 6 rows'
  - keys: e
    wait: 'Export current view[\s\S]*enter apply'
  - check: dialog
  - keys: ctrl+u
  - text: "bands.json"
  - keys: enter
    toast: 'Wrote 6 rows'
    check: done
  - file: "{out}/bands.json"
  - keys: e
    wait: 'Export current view[\s\S]*enter apply'
  - keys: ctrl+u
  - text: "never.csv"
  - keys: esc
    wait_gone: 'Export current view'
  - file: "{out}/never.csv"   # Esc with a path typed: nothing written
