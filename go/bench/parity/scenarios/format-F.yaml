description: |
  `F` sets the cursor column's format: a Python spec or a digit count; the dialog
  opens with the current format; an empty entry resets it. A bad spec is refused.
covers:
  - "README Column formats: F takes a Python format spec (.2f, .3e, ,d, .1%); an empty entry goes back to automatic."
  - "help: **F** | set the cursor column's format: a Python spec (.2f, .3e, ,d) or a number of digits; empty resets it"
fixture: demo
steps:
  - keys: right right
  - keys: F
    wait: "Format of[\\s\\S]*enter apply"
  - check: dialog
  - text: ".3e"
  - keys: enter
    toast: "✓ ra: .3e"
    check: sci
  - keys: right right right right right right right right right right
  - keys: F
    wait: "Format of[\\s\\S]*enter apply"
  - text: ".1%"
  - keys: enter
    toast: "✓ trailLength"
    check: percent
  - keys: F
    wait: "Format of[\\s\\S]*enter apply"
  - text: "zz"
  - keys: enter
  - check: bad-spec
  - keys: esc
  - keys: left left left left left left left left left left
  - keys: F
    wait: "Format of[\\s\\S]*enter apply"
  - check: prefilled
  - keys: ctrl+u enter
    toast: "✓ ra"
    check: reset
