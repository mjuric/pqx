description: |
  `<`, `>` and `F` in the detail panel change the selected field's column format in the
  grid (the panel itself keeps full precision).
covers:
  - "README Keys: d · Esc | row detail panel (= y i F < > work there too, on the selected field)"
fixture: demo
python_bug:
  - checks: [set]
    region: keybar
    note: "Python pqx's key bar can keep the filter box's keys after a dialog with an input closes (racy)"
steps:
  - keys: d
    wait: "file row"
  - keys: tab down down
  - keys: "<"
    toast: "✓ ra:"
  - keys: "<"
    toast: "✓ ra:"
    check: fewer
    expect: ['f64·deg·\.4f', 'ra +333\.1528812003216']   # the panel keeps full precision
  - keys: ">"
    toast: "✓ ra:"
    check: more
  - keys: F
    wait: 'Format of[\s\S]*enter apply'
  - check: dialog
  - text: ".1f"
  - keys: enter
    toast: "✓ ra:"
    check: set
