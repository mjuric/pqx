description: |
  A filter naming a column that doesn't exist shows its error inline and keeps the
  current view and place.
covers:
  - "README Filter: errors show inline without losing your place"
fixture: demo
steps:
  - keys: pgdn down down
    wait_gone: 'row 0\b'
  - keys: /
    wait: 'enter apply'
  - text: "nosuchcolumn > 3"
  - keys: enter
    toast: 'Query failed'
    toast_gone: false  # (it stays 8 s; the status line says the same)
    check: error
    expect: '✗ Query failed   reason: unknown column "nosuchcolumn"'
    expect@120x40: '^ │   27 +170000000000000027'   # the place is kept
  - keys: esc
    wait: '/ filter'
  - check: back-in-grid
