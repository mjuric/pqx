description: |
  `--format COL=SPEC` sets a column's format for the session (a spec and a digit count).
covers:
  - "README Column formats: --format COL=SPEC sets a format for one session without saving it."
fixture: demo
args: ["--format", "ra=.2f", "--format", "mag=3", "--format", "diaSourceId=,d"]
steps:
  - check: first
    expect: ['f64·deg·\.2f', 'i64·,d', '170,000,000,000,000,000']
  - keys: end
  - check: end
    expect: 'f32·mag·3|mag'
