description: |
  Clicking a header (found by its text) sorts by that column, as `s` does: ascending,
  then descending. ra has no ties.
covers:
  - "README All keys: clicking a header does the same"
fixture: demo
sizes: [[120, 40]]
steps:
  - click: '(?<= )ra(?= )'
    wait: 'sorted ra ↑'
  - check: click-1
  - click: '(?<= )ra ↑'
    wait: 'sorted ra ↓'
  - check: click-2
