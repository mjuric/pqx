description: |
  `g` opens the go-to-row dialog (it shows the row count); 1234, 50% and -1 jump there.
covers:
  - "README Keys: g | go to a row: 1234, 1.5M, 50%, -1"
  - "help: **g** | go to row — 1234, 1.5M, 50%, -1"
fixture: demo
steps:
  - keys: g
    wait: 'Go to row'
  - check: dialog
    expect: 'of 20,000'
  - text: "1234"
  - keys: enter
    wait: 'row 1,234$|row 1,234 '
  - check: row-1234
    expect: '1,234 +170000000000001234'
    expect_not: 'Go to row'
  - keys: g
    wait: 'Go to row'
  - text: "50%"
  - keys: enter
    wait: 'row 10,000\b'
  - check: half
    expect: '10,000 +170000000000010000'
  - keys: g
    wait: 'Go to row'
  - text: "-1"
  - keys: enter
    wait: 'row 19,999\b'
  - check: last
    expect: '19,999 +170000000000019999'
