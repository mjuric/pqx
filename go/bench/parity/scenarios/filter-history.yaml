description: |
  ↑/↓ in the filter box browse earlier filters.
covers:
  - "help: **↑/↓** browse history"
fixture: demo
steps:
  - keys: /
    wait: "enter apply"
  - text: "band = 'g'"
  - keys: enter
    wait: "x clear filter"
  - keys: /
    wait: "enter apply"
  - keys: ctrl+x
  - text: "band = 'g' and mag < 20"
  - keys: enter
    wait: "x clear filter"
  - check: second
  - keys: /
    wait: "enter apply"
  - keys: ctrl+x
  - keys: up
  - check: up-1
  - keys: up
  - check: up-2
  - keys: down
  - check: down-1
