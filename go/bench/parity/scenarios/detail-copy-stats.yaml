description: |
  `y` in the detail panel copies the selected field at full precision (OSC 52);
  `i` opens its statistics.
covers:
  - "README Keys: d · Esc | row detail panel (= y i F < > work there too, on the selected field)"
  - "help: the detail panel and **y** keep full precision"
fixture: demo
threads: 1
quiet: 1.0
steps:
  - keys: d
    wait: "file row"
  - keys: tab down down
  - keys: y
    clipboard: "^333\\.15288120032"
    toast: "Copied"
    check: copied
  - keys: i
    wait: "Profiled"
  # Python pqx sometimes draws the first histogram at a stale width (seen at 120x40);
  # toggling log counts twice redraws it at the panel's width
  - keys: l l
  - check: stats
