description: |
  Sorting while scrolled right keeps the columns in view (the leftmost may move by one
  as the row labels widen); the cursor goes to the first row.
covers:
  - "native-port.md: Keep the viewport (filtering, sorting or changing columns keeps the leftmost column)"
fixture: wide
quiet: 1.0
steps:
  - keys: pgdn down down down
    wait_gone: 'row 0\b'
  - keys: right right right right right right right right right right right right right right
  - check: before
    expect@120x40: '‹ +c05'
  - keys: s
    wait: 'sorted c13 ↑'
  - check: sorted
    expect@120x40: '‹ +c0[56] '
  - keys: s
    wait: 'sorted c13 ↓'
  - keys: s
    wait_gone: 'sorted c13'
  - check: sort-off
