description: |
  `<` and `>` drop or add a digit for the cursor column (decimals for angles and MJD,
  significant digits otherwise); each change is confirmed in a notification.
covers:
  - "help: **<** / **>** | one digit fewer / more for the cursor column"
  - "README Column formats: < and > drop or add a digit"
fixture: demo
steps:
  - keys: right right
  - keys: "<"
    toast: "✓ ra:"
  - keys: "<"
    toast: "✓ ra:"
    check: ra-fewer
  - keys: right right right right
  - keys: ">"
    toast: "✓ midpointMjdTai:"
  - keys: ">"
    toast: "✓ midpointMjdTai:"
    check: mjd-more
  - keys: right right right right
  - keys: "<"
    toast: "✓ mag:"
    check: mag-fewer
