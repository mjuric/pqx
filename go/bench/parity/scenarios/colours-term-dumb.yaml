description: |
  The colour system for TERM=dumb: Rich finds no colour and Textual falls back to truecolor (Bubble Tea's own detection would draw none). The grid and the sky map in the colours Python pqx sends.
covers:
  - "Go pqx draws in the colour system Python pqx (Textual) picks from TERM and COLORTERM"
fixture: demo
env: {TERM: dumb, COLORTERM: null}
colours: truecolor
threads: 1
quiet: 1.0
sizes: [[120, 40]]
steps:
  - check: grid
  - keys: "4"
    wait: '✓ Binned ra × dec'
  - check: sky
    expect: ['mode sky ▾', 'density:']
