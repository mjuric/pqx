description: |
  Esc while a slow count runs cancels it, and the status line says so.
covers:
  - "README Big files: Long queries run in the background, and Esc cancels them."
  - "help: **Esc** | cancel running queries"
fixture: slow
sizes: [[120, 40]]
intended:
  - checks: [cancelled]
    region: status
    ref_shows: '^ │ \* Counting rows   first 1,000 shown'   # Python, until DuckDB has stopped (~0.17 s)
    other_shows: '^ │ ✓ rows'                               # Go shows the cancelled count at once
    note: "decided: Go shows the cancelled state at once"
steps:
  - keys: /
    wait: 'enter apply'
  - text: "levenshtein(repeat(band, 300), repeat(cast(detector as varchar), 200)) > 5"
  - keys: enter
    settle: false
  - wait: '(?i)counting'
    settle: false
  - keys: esc
    settle: false
    toast: 'Cancelled running queries'
    check: cancelled
