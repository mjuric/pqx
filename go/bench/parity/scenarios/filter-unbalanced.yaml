description: |
  A filter with unbalanced parentheses (which would escape pqx's own parentheses) is
  refused with an inline error.
covers:
  - "native-port.md Security: where_sql rejects unbalanced parentheses"
fixture: demo
steps:
  - keys: /
  - text: "mag < 20) or (1=1"
  - keys: enter
    toast: "Query failed"
    toast_gone: false
    check: error
  - keys: ctrl+u
  - text: "1=1; select 42"
  - keys: enter
    toast: "Query failed"
    toast_gone: false
    check: two-statements
