description: |
  `-` hides the cursor column; `p` pins the columns up to the cursor, which then stay
  when scrolling right.
covers:
  - "help: **-** hides the cursor column"
  - "help: **p** | pin columns up to the cursor (stay visible when scrolling right)"
fixture: wide
steps:
  - keys: right right
  - keys: "-"
    toast: "Hid c01"
    check: hidden
  - keys: p
  - check: pinned
  - keys: end
  - check: end-with-pin
  - keys: home
  - check: home
