description: |
  `m` toggles sampling for stats and plots.
covers:
  - "README All keys: m | toggle sampling for stats and plots"
fixture: demo
threads: 1
quiet: 1.0
steps:
  - keys: "3"
    wait: '✓ Profiled diaSourceId'
  - keys: m
    toast: 'Sampling on'
    check: sampling-on
    expect: '! Profiled diaSourceId, sampled'
  - keys: m
    toast: 'Sampling off'
    check: sampling-off
    expect: '✓ Profiled diaSourceId'
