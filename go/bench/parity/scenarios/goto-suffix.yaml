description: |
  `g` with a suffixed count (1.5M) on a 2,000,000-row file, then Ctrl+Home back.
covers:
  - "README Keys: g | go to a row: 1234, 1.5M, 50%, -1"
  - "README Big files: Jumps anywhere."
fixture: slow
sizes: [[120, 40]]
steps:
  - keys: g
    wait: 'Go to row'
  - text: "1.5M"
  - keys: enter
    wait: 'row 1,500,000\b'
  - check: row-1.5M
    expect: '1,500,000 +170000000001500000'
  - keys: ctrl+home
    wait: 'row 0\b'
  - check: first
