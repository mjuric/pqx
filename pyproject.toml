[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pqx"
dynamic = ["version"]  # from git tags via setuptools-scm (vX.Y.Z)
description = "A fast, friendly terminal explorer for Parquet files (Textual + DuckDB)"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Mario Juric" }]
requires-python = ">=3.10"
dependencies = [
  "textual>=8.2,<9",  # GridTable overrides a private DataTable renderer (see docs/design/wide-tables.md)
  "duckdb>=1.1",
  "pyarrow>=15",  # (14.0.0 and older: CVE-2023-47248, arbitrary code execution reading IPC/Parquet)
  "numpy>=1.23",
  "pytz",
  "pyyaml>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pandas", "ruff"]

[project.scripts]
pqx = "pqx.cli:main"

[tool.setuptools]
packages = ["pqx"]

[tool.setuptools_scm]
version_file = "pqx/_version.py"

[tool.setuptools.package-data]
pqx = ["*.tcss"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]  # pyflakes + syntax errors
